<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TaskFlow">
<title>TaskFlow</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#F5F4F0;--surface:#FFFFFF;--surface2:#F0EEE9;--surface3:#E8E5DE;
  --text:#1A1916;--text2:#6B6860;--text3:#A09D96;
  --accent:#2563EB;--accent-light:#EFF4FF;--accent-text:#1D4ED8;
  --green:#16A34A;--green-light:#F0FDF4;--green-text:#15803D;
  --red:#DC2626;--red-light:#FEF2F2;
  --border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.12);
  --radius:14px;--radius-sm:8px;--radius-full:100px;
  --font:'DM Sans',sans-serif;
}
html,body{height:100%;background:var(--bg);font-family:var(--font);color:var(--text);}
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;}
.notif-banner{background:var(--accent);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.notif-banner.hidden{display:none;}
.notif-banner-text{flex:1;font-size:13px;font-weight:500;line-height:1.4;}
.notif-banner-btn{background:rgba(255,255,255,0.2);border:none;color:#fff;font-family:var(--font);font-size:12px;font-weight:600;padding:6px 14px;border-radius:var(--radius-full);cursor:pointer;white-space:nowrap;}
.notif-banner-close{background:none;border:none;color:rgba(255,255,255,0.7);font-size:20px;cursor:pointer;line-height:1;padding:0 4px;}
.header{background:var(--surface);border-bottom:0.5px solid var(--border);padding:20px 20px 14px;position:sticky;top:0;z-index:10;flex-shrink:0;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.header-left h1{font-size:26px;font-weight:600;letter-spacing:-0.6px;line-height:1;}
.header-left p{font-size:13px;color:var(--text3);margin-top:3px;}
.header-actions{display:flex;gap:8px;}
.btn-icon{width:38px;height:38px;border-radius:var(--radius-full);background:var(--surface2);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.15s;flex-shrink:0;}
.btn-icon:active{background:var(--surface3);}
.btn-icon svg{width:18px;height:18px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.btn-icon.active-filter{background:var(--accent);}
.btn-icon.active-filter svg{stroke:#fff;}
.search-bar{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:var(--radius-sm);padding:0 12px;height:40px;}
.search-bar svg.search-icon{width:15px;height:15px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.search-input{border:none;background:transparent;font-family:var(--font);font-size:14px;color:var(--text);flex:1;outline:none;}
.search-input::placeholder{color:var(--text3);}
.search-clear{background:var(--text3);border:none;cursor:pointer;display:none;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;flex-shrink:0;padding:0;}
.search-clear svg{width:9px;height:9px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.search-clear.visible{display:flex;}
.filter-row{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.filter-row.hidden{display:none;}
.filter-pill{padding:5px 14px;border-radius:var(--radius-full);border:1.5px solid var(--border2);font-size:12px;font-weight:500;cursor:pointer;background:transparent;font-family:var(--font);color:var(--text2);white-space:nowrap;transition:all 0.15s;}
.filter-pill.selected{border-color:var(--accent);background:var(--accent-light);color:var(--accent-text);}
.filter-pill.all.selected{border-color:var(--text);background:var(--surface3);color:var(--text);}
.screen{display:none;flex-direction:column;flex:1;}
.screen.active{display:flex;}
.scroll-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:90px;}
.stats-row{display:flex;gap:10px;padding:16px 20px 0;}
.stat-card{flex:1;background:var(--surface2);border-radius:12px;padding:12px 14px;}
.stat-num{font-size:22px;font-weight:600;letter-spacing:-0.5px;}
.stat-label{font-size:11px;color:var(--text2);margin-top:2px;}
.stat-card.accent{background:var(--accent);}
.stat-card.accent .stat-num,.stat-card.accent .stat-label{color:#fff;}
.stat-card.accent .stat-label{opacity:0.75;}
.section{padding:20px 20px 0;}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.section-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--text3);}
.task-list{display:flex;flex-direction:column;gap:2px;}
.task-item{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;background:var(--surface);border-radius:12px;border:0.5px solid var(--border);cursor:pointer;transition:background 0.12s;}
.task-item:active{background:var(--surface2);}
.task-item.done{background:var(--surface2);border-color:transparent;}
.task-item.done .task-text{text-decoration:line-through;color:var(--text3);}
.checkbox{width:22px;height:22px;border-radius:7px;border:2px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;margin-top:1px;}
.checkbox.checked{background:var(--green);border-color:var(--green);}
.checkbox svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity 0.15s;}
.checkbox.checked svg{opacity:1;}
.task-content{flex:1;min-width:0;}
.task-text{font-size:15px;font-weight:400;line-height:1.4;color:var(--text);}
.task-meta{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap;}
.tag{font-size:11px;font-weight:500;padding:2px 8px;border-radius:var(--radius-full);}
.tag.work{background:#FEF3C7;color:#92400E;}
.tag.personal{background:#EDE9FE;color:#5B21B6;}
.tag.urgent{background:var(--red-light);color:var(--red);}
.tag.health{background:var(--green-light);color:var(--green-text);}
.tag.finance{background:#E0F2FE;color:#0369A1;}
.reminder-badge{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--text3);}
.reminder-badge svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.priority-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:8px;}
.edit-icon{flex-shrink:0;opacity:0.3;margin-top:3px;}
.empty-state{padding:32px 0;text-align:center;color:var(--text3);font-size:14px;}
.completed-section{padding:16px 20px 0;}
.completed-header{display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 0;user-select:none;}
.chevron{width:20px;height:20px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;transition:transform 0.25s;}
.chevron svg{width:11px;height:11px;stroke:var(--text2);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.chevron.open{transform:rotate(180deg);}
.completed-label{font-size:13px;font-weight:500;color:var(--text2);}
.completed-count{font-size:11px;color:var(--text3);background:var(--surface2);padding:2px 8px;border-radius:var(--radius-full);}
.done-task-list{display:none;flex-direction:column;gap:2px;}
.done-task-list.open{display:flex;}
.cal-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:90px;}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0;}
.cal-month-label{font-size:18px;font-weight:600;letter-spacing:-0.4px;}
.cal-nav-btns{display:flex;gap:4px;}
.cal-nav-btn{width:34px;height:34px;border-radius:var(--radius-full);background:var(--surface2);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cal-nav-btn svg{width:16px;height:16px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.cal-grid{padding:12px 20px 0;}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
.cal-dow-cell{text-align:center;font-size:11px;font-weight:600;color:var(--text3);padding:4px 0;text-transform:uppercase;letter-spacing:0.4px;}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-day{min-height:52px;border-radius:10px;padding:6px 4px 4px;cursor:pointer;transition:background 0.15s;display:flex;flex-direction:column;align-items:center;}
.cal-day:active{background:var(--surface3);}
.cal-day.other-month .cal-day-num{color:var(--text3);}
.cal-day.today .cal-day-num{background:var(--accent);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;}
.cal-day.selected{background:var(--accent-light);}
.cal-day-num{font-size:13px;font-weight:500;color:var(--text);width:26px;height:26px;display:flex;align-items:center;justify-content:center;}
.cal-dots{display:flex;gap:2px;margin-top:3px;flex-wrap:wrap;justify-content:center;}
.cal-dot{width:5px;height:5px;border-radius:50%;}
.cal-tasks{padding:16px 20px 0;}
.cal-tasks-header{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:10px;}
.fab{position:fixed;bottom:80px;right:20px;width:56px;height:56px;border-radius:var(--radius-full);background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(37,99,235,0.4);transition:transform 0.15s;z-index:20;}
.fab:active{transform:scale(0.94);}
.fab svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:var(--surface);border-top:0.5px solid var(--border);display:flex;align-items:center;z-index:10;padding-bottom:env(safe-area-inset-bottom);}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:6px 0;}
.nav-icon svg{width:22px;height:22px;stroke:var(--text3);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke 0.15s;}
.nav-label{font-size:10px;color:var(--text3);font-weight:500;transition:color 0.15s;}
.nav-item.active .nav-icon svg{stroke:var(--accent);}
.nav-item.active .nav-label{color:var(--accent);}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;display:none;align-items:flex-end;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:var(--surface);border-radius:24px 24px 0 0;width:100%;padding:20px;padding-bottom:40px;animation:slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1);max-height:92vh;overflow-y:auto;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:40px;height:4px;background:var(--surface3);border-radius:2px;margin:0 auto 20px;}
.modal-title{font-size:18px;font-weight:600;letter-spacing:-0.4px;margin-bottom:20px;}
.form-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.6px;color:var(--text3);margin-bottom:6px;display:block;}
.form-input{width:100%;font-family:var(--font);font-size:15px;color:var(--text);background:var(--surface2);border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:12px 14px;outline:none;transition:border 0.15s;margin-bottom:14px;}
.form-input:focus{border-color:var(--accent);}
.tag-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.tag-pick{padding:6px 14px;border-radius:var(--radius-full);border:1.5px solid var(--border2);font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s;background:transparent;font-family:var(--font);color:var(--text2);}
.tag-pick.selected{border-color:var(--accent);background:var(--accent-light);color:var(--accent-text);}
.priority-row{display:flex;gap:8px;margin-bottom:14px;}
.pri-pick{flex:1;padding:8px;border-radius:var(--radius-sm);border:1.5px solid var(--border2);font-size:12px;font-weight:600;cursor:pointer;text-align:center;transition:all 0.15s;background:transparent;font-family:var(--font);}
.pri-pick[data-p="high"].selected{border-color:var(--red);background:var(--red-light);color:var(--red);}
.pri-pick[data-p="medium"].selected{border-color:#F59E0B;background:#FFFBEB;color:#92400E;}
.pri-pick[data-p="low"].selected{border-color:var(--text3);background:var(--surface2);color:var(--text2);}
.btn-save{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-family:var(--font);font-size:15px;font-weight:600;cursor:pointer;margin-bottom:8px;}
.btn-save:active{opacity:0.85;}
.btn-del{width:100%;padding:12px;background:var(--red-light);color:var(--red);border:none;border-radius:12px;font-family:var(--font);font-size:14px;font-weight:500;cursor:pointer;}
.time-row{display:flex;gap:8px;margin-bottom:14px;}
.time-input{flex:1;font-family:var(--font);font-size:14px;color:var(--text);background:var(--surface2);border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:10px 12px;outline:none;}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:rgba(10,10,10,0.88);color:#fff;border-radius:14px;padding:10px 18px;font-size:13px;font-weight:500;z-index:300;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="notif-banner" id="notifBanner">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
  <span class="notif-banner-text">Enable notifications for task reminders</span>
  <button class="notif-banner-btn" onclick="requestNotifications()">Enable</button>
  <button class="notif-banner-close" onclick="dismissNotifBanner()">&#xd7;</button>
</div>
<div class="header">
  <div class="header-top">
    <div class="header-left"><h1 id="headerTitle">My Tasks</h1><p id="headerSub"></p></div>
    <div class="header-actions" id="headerActions">
      <button class="btn-icon" id="filterBtn" onclick="toggleFilterRow()">
        <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/></svg>
      </button>
    </div>
  </div>
  <div class="search-bar">
    <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="search-input" id="searchInput" placeholder="Search tasks&hellip;" oninput="onSearch()">
    <button class="search-clear" id="searchClear" onclick="clearSearch()">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="filter-row hidden" id="filterRow"></div>
</div>

<div class="screen active" id="homeScreen">
  <div class="scroll-content">
    <div class="stats-row">
      <div class="stat-card accent"><div class="stat-num" id="statPending">0</div><div class="stat-label">Pending</div></div>
      <div class="stat-card"><div class="stat-num" id="statDoneToday">0</div><div class="stat-label">Done today</div></div>
      <div class="stat-card"><div class="stat-num" id="statReminders">0</div><div class="stat-label">Reminders</div></div>
    </div>
    <div class="section">
      <div class="section-header"><span class="section-title" id="activeTitle">Active</span></div>
      <div class="task-list" id="activeList"></div>
    </div>
    <div class="completed-section">
      <div class="completed-header" onclick="toggleCompleted()">
        <div class="chevron" id="chevron"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></div>
        <span class="completed-label">Completed</span>
        <span class="completed-count" id="statDone">0</span>
      </div>
      <div class="done-task-list" id="doneList"></div>
    </div>
  </div>
</div>

<div class="screen" id="calendarScreen">
  <div class="cal-scroll">
    <div class="cal-nav">
      <span class="cal-month-label" id="calMonthLabel"></span>
      <div class="cal-nav-btns">
        <button class="cal-nav-btn" onclick="changeMonth(-1)"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
        <button class="cal-nav-btn" onclick="changeMonth(1)"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
      </div>
    </div>
    <div class="cal-grid">
      <div class="cal-dow">
        <div class="cal-dow-cell">Mon</div><div class="cal-dow-cell">Tue</div><div class="cal-dow-cell">Wed</div>
        <div class="cal-dow-cell">Thu</div><div class="cal-dow-cell">Fri</div><div class="cal-dow-cell">Sat</div><div class="cal-dow-cell">Sun</div>
      </div>
      <div class="cal-days" id="calDays"></div>
    </div>
    <div class="cal-tasks">
      <div class="cal-tasks-header" id="calTasksHeader"></div>
      <div class="task-list" id="calTaskList"></div>
    </div>
  </div>
</div>

<button class="fab" id="fab" onclick="openModal(null)">
  <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<div class="bottom-nav">
  <div class="nav-item active" id="navHome" onclick="showScreen('home')">
    <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
    <span class="nav-label">Home</span>
  </div>
  <div class="nav-item" id="navCal" onclick="showScreen('calendar')">
    <div class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
    <span class="nav-label">Calendar</span>
  </div>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">New task</div>
    <label class="form-label">Task</label>
    <input class="form-input" id="taskInput" placeholder="What needs to be done?" onkeydown="if(event.key==='Enter')saveTask()">
    <label class="form-label">Tag</label>
    <div class="tag-row">
      <button class="tag-pick" data-tag="work" onclick="selectTag(this)">Work</button>
      <button class="tag-pick" data-tag="personal" onclick="selectTag(this)">Personal</button>
      <button class="tag-pick" data-tag="urgent" onclick="selectTag(this)">Urgent</button>
      <button class="tag-pick" data-tag="health" onclick="selectTag(this)">Health</button>
      <button class="tag-pick" data-tag="finance" onclick="selectTag(this)">Finance</button>
    </div>
    <label class="form-label">Priority</label>
    <div class="priority-row">
      <button class="pri-pick" data-p="high" onclick="selectPriority(this)">High</button>
      <button class="pri-pick selected" data-p="medium" onclick="selectPriority(this)">Medium</button>
      <button class="pri-pick" data-p="low" onclick="selectPriority(this)">Low</button>
    </div>
    <label class="form-label">Reminder (optional)</label>
    <div class="time-row">
      <input class="time-input" type="date" id="remindDate">
      <input class="time-input" type="time" id="remindTime">
    </div>
    <button class="btn-save" id="modalSaveBtn" onclick="saveTask()">Add task</button>
    <button class="btn-del" id="modalDelBtn" style="display:none" onclick="deleteEditingTask()">Delete task</button>
  </div>
</div>

<script>
let tasks=JSON.parse(localStorage.getItem('tf_tasks')||'[]');
let selTag='',selPri='medium',doneOpen=false;
let calYear=new Date().getFullYear(),calMonthIdx=new Date().getMonth(),selectedDay=null;
let activeFilter=null,filterRowOpen=false,editingId=null;
function saveTasks(){localStorage.setItem('tf_tasks',JSON.stringify(tasks));}

function checkNotifBanner(){
  if(!('Notification' in window)||Notification.permission==='granted'||localStorage.getItem('notifDismissed'))
    document.getElementById('notifBanner').classList.add('hidden');
}
function dismissNotifBanner(){localStorage.setItem('notifDismissed','1');document.getElementById('notifBanner').classList.add('hidden');}
async function requestNotifications(){
  if(!('Notification' in window)){showToast('Not supported on this browser');return;}
  const r=await Notification.requestPermission();
  if(r==='granted'){
    document.getElementById('notifBanner').classList.add('hidden');
    showToast('Notifications enabled!');
    tasks.filter(t=>!t.done&&t.reminder&&t.reminder>Date.now()).forEach(scheduleReminder);
  } else {
    showToast('Blocked - check iPhone Settings > TaskFlow');
    document.getElementById('notifBanner').classList.add('hidden');
  }
}
function scheduleReminder(task){
  const delay=task.reminder-Date.now();
  if(delay<=0)return;
  setTimeout(()=>{
    showToast('Reminder: '+task.text.substring(0,32)+(task.text.length>32?'...':''));
    if(Notification.permission==='granted'){try{new Notification('TaskFlow',{body:task.text});}catch(e){}}
  },delay);
}

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const fab=document.getElementById('fab');
  if(name==='home'){
    document.getElementById('homeScreen').classList.add('active');
    document.getElementById('navHome').classList.add('active');
    document.getElementById('headerTitle').textContent='My Tasks';
    document.getElementById('headerSub').textContent='';
    document.getElementById('headerActions').style.display='flex';
    document.querySelector('.search-bar').style.display='flex';
    fab.style.display='flex';
  } else if(name==='calendar'){
    document.getElementById('calendarScreen').classList.add('active');
    document.getElementById('navCal').classList.add('active');
    document.getElementById('headerTitle').textContent='Calendar';
    document.getElementById('headerSub').textContent='Tasks with reminders';
    document.getElementById('headerActions').style.display='none';
    document.querySelector('.search-bar').style.display='none';
    document.getElementById('filterRow').classList.add('hidden');
    fab.style.display='flex';
    renderCalendar();
  }
}

function onSearch(){
  const v=document.getElementById('searchInput').value;
  document.getElementById('searchClear').classList.toggle('visible',v.length>0);
  renderAll();
}
function clearSearch(){
  document.getElementById('searchInput').value='';
  document.getElementById('searchClear').classList.remove('visible');
  renderAll();
}

function toggleFilterRow(){
  filterRowOpen=!filterRowOpen;
  document.getElementById('filterRow').classList.toggle('hidden',!filterRowOpen);
  document.getElementById('filterBtn').classList.toggle('active-filter',filterRowOpen);
  if(filterRowOpen)buildFilterPills();
}
function buildFilterPills(){
  const tags=[...new Set(tasks.map(t=>t.tag).filter(Boolean))];
  let html=`<button class="filter-pill all${!activeFilter?' selected':''}" onclick="setFilter(null)">All</button>`;
  tags.forEach(tag=>{
    const label=tag.charAt(0).toUpperCase()+tag.slice(1);
    html+=`<button class="filter-pill${activeFilter===tag?' selected':''}" onclick="setFilter('${tag}')">${label}</button>`;
  });
  document.getElementById('filterRow').innerHTML=html;
}
function setFilter(tag){
  activeFilter=tag;
  buildFilterPills();
  renderAll();
  showToast(tag?'Filter: '+(tag.charAt(0).toUpperCase()+tag.slice(1)):'All tasks');
}

function openModal(taskId){
  editingId=taskId;
  const isEdit=taskId!==null;
  document.getElementById('modalTitle').textContent=isEdit?'Edit task':'New task';
  document.getElementById('modalSaveBtn').textContent=isEdit?'Save changes':'Add task';
  document.getElementById('modalDelBtn').style.display=isEdit?'block':'none';
  selTag='';selPri='medium';
  document.querySelectorAll('.tag-pick').forEach(b=>b.classList.remove('selected'));
  document.querySelectorAll('.pri-pick').forEach(b=>{b.classList.remove('selected');if(b.dataset.p==='medium')b.classList.add('selected');});
  document.getElementById('remindDate').value=new Date().toISOString().split('T')[0];
  document.getElementById('remindTime').value='';
  if(isEdit){
    const t=tasks.find(t=>t.id===taskId);
    if(!t)return;
    document.getElementById('taskInput').value=t.text;
    selTag=t.tag||'';selPri=t.priority||'medium';
    if(t.tag){const tp=document.querySelector('.tag-pick[data-tag="'+t.tag+'"]');if(tp)tp.classList.add('selected');}
    document.querySelectorAll('.pri-pick').forEach(b=>{b.classList.remove('selected');if(b.dataset.p===selPri)b.classList.add('selected');});
    if(t.reminder){const d=new Date(t.reminder);document.getElementById('remindDate').value=d.toISOString().split('T')[0];document.getElementById('remindTime').value=d.toTimeString().slice(0,5);}
  } else {
    document.getElementById('taskInput').value='';
  }
  document.getElementById('modalBg').classList.add('open');
  setTimeout(()=>document.getElementById('taskInput').focus(),300);
}
function closeModal(){document.getElementById('modalBg').classList.remove('open');editingId=null;}
function selectTag(el){
  document.querySelectorAll('.tag-pick').forEach(b=>b.classList.remove('selected'));
  if(selTag===el.dataset.tag){selTag='';return;}
  el.classList.add('selected');selTag=el.dataset.tag;
}
function selectPriority(el){
  document.querySelectorAll('.pri-pick').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');selPri=el.dataset.p;
}
function saveTask(){
  const text=document.getElementById('taskInput').value.trim();
  if(!text){showToast('Please enter a task name');return;}
  const rd=document.getElementById('remindDate').value;
  const rt=document.getElementById('remindTime').value;
  const reminder=(rd&&rt)?new Date(rd+'T'+rt).getTime():null;
  if(editingId!==null){
    const t=tasks.find(t=>t.id===editingId);
    if(t){t.text=text;t.tag=selTag;t.priority=selPri;t.reminder=reminder;saveTasks();renderAll();closeModal();showToast('Task updated');if(reminder&&Notification.permission==='granted')scheduleReminder(t);}
  } else {
    const task={id:Date.now(),text,tag:selTag,priority:selPri,done:false,reminder,createdAt:Date.now(),doneAt:null};
    tasks.unshift(task);saveTasks();renderAll();closeModal();showToast('Task added');
    if(reminder){if(Notification.permission!=='granted')showToast('Enable notifications for this reminder');else scheduleReminder(task);}
  }
}
function deleteEditingTask(){
  if(editingId===null)return;
  tasks=tasks.filter(t=>t.id!==editingId);
  saveTasks();renderAll();closeModal();showToast('Task deleted');
}
function toggleDone(id,e){
  e.stopPropagation();
  const t=tasks.find(t=>t.id===id);
  if(!t)return;
  t.done=!t.done;t.doneAt=t.done?Date.now():null;
  saveTasks();
  if(t.done&&!doneOpen)openCompleted();
  renderAll();
  showToast(t.done?'Moved to Completed':'Moved back to Active');
}
function renderAll(){
  const search=document.getElementById('searchInput').value.toLowerCase();
  let active=tasks.filter(t=>!t.done);
  let done=tasks.filter(t=>t.done);
  if(search){active=active.filter(t=>t.text.toLowerCase().includes(search));done=done.filter(t=>t.text.toLowerCase().includes(search));}
  if(activeFilter)active=active.filter(t=>t.tag===activeFilter);
  const todayStart=new Date();todayStart.setHours(0,0,0,0);
  document.getElementById('statPending').textContent=tasks.filter(t=>!t.done).length;
  document.getElementById('statDoneToday').textContent=tasks.filter(t=>t.done&&t.doneAt&&t.doneAt>=todayStart.getTime()).length;
  document.getElementById('statReminders').textContent=tasks.filter(t=>!t.done&&t.reminder&&t.reminder>Date.now()).length;
  document.getElementById('statDone').textContent=tasks.filter(t=>t.done).length;
  document.getElementById('activeTitle').textContent=activeFilter?'Active - '+(activeFilter.charAt(0).toUpperCase()+activeFilter.slice(1)):'Active';
  document.getElementById('activeList').innerHTML=active.length===0
    ?'<div class="empty-state">'+(search||activeFilter?'No tasks match.':'No active tasks - tap + to add one.')+'</div>'
    :active.map(t=>taskCard(t,false)).join('');
  document.getElementById('doneList').innerHTML=done.length===0
    ?'<div class="empty-state">Nothing completed yet.</div>'
    :done.map(t=>taskCard(t,true)).join('');
  if(document.getElementById('calendarScreen').classList.contains('active'))renderCalendar();
}
function taskCard(t,isDone){
  const pColor=t.priority==='high'?'var(--red)':t.priority==='medium'?'#F59E0B':'var(--text3)';
  const tagHTML=t.tag?'<span class="tag '+t.tag+'">'+t.tag+'</span>':'';
  let remHTML='';
  if(t.reminder){
    const d=new Date(t.reminder);
    const overdue=t.reminder<Date.now()&&!t.done;
    remHTML='<span class="reminder-badge"'+(overdue?' style="color:var(--red)"':'')+'>'+
      '<svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>'+
      d.toLocaleDateString('en',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'})+'</span>';
  }
  const doneTime=isDone&&t.doneAt?'<span style="font-size:11px;color:var(--text3)">Done '+new Date(t.doneAt).toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'})+'</span>':'';
  return '<div class="task-item'+(isDone?' done':'')+'" onclick="openModal('+t.id+')">'+
    '<div class="priority-dot" style="background:'+pColor+';margin-top:8px;"></div>'+
    '<div class="checkbox'+(isDone?' checked':'')+'" onclick="toggleDone('+t.id+',event)">'+
      '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>'+
    '<div class="task-content">'+
      '<div class="task-text">'+esc(t.text)+'</div>'+
      '<div class="task-meta">'+tagHTML+remHTML+doneTime+'</div>'+
    '</div>'+
    '<svg class="edit-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>'+
  '</div>';
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function openCompleted(){doneOpen=true;document.getElementById('doneList').classList.add('open');document.getElementById('chevron').classList.add('open');}
function toggleCompleted(){doneOpen=!doneOpen;document.getElementById('doneList').classList.toggle('open',doneOpen);document.getElementById('chevron').classList.toggle('open',doneOpen);}

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function changeMonth(dir){calMonthIdx+=dir;if(calMonthIdx>11){calMonthIdx=0;calYear++;}if(calMonthIdx<0){calMonthIdx=11;calYear--;}selectedDay=null;renderCalendar();}
function renderCalendar(){
  document.getElementById('calMonthLabel').textContent=MONTHS[calMonthIdx]+' '+calYear;
  const today=new Date();
  const firstDay=new Date(calYear,calMonthIdx,1);
  let startDow=firstDay.getDay()-1;if(startDow<0)startDow=6;
  const dim=new Date(calYear,calMonthIdx+1,0).getDate();
  const dip=new Date(calYear,calMonthIdx,0).getDate();
  const mTasks=tasks.filter(t=>{if(!t.reminder)return false;const d=new Date(t.reminder);return d.getFullYear()===calYear&&d.getMonth()===calMonthIdx;});
  const dotMap={};
  mTasks.forEach(t=>{const d=new Date(t.reminder).getDate();if(!dotMap[d])dotMap[d]=[];const c=t.priority==='high'?'#DC2626':t.priority==='medium'?'#F59E0B':'#A09D96';if(dotMap[d].length<3)dotMap[d].push(c);});
  const total=Math.ceil((startDow+dim)/7)*7;
  let html='';
  for(let i=0;i<total;i++){
    const n=i-startDow+1;
    const isPrev=n<1,isNext=n>dim;
    const disp=isPrev?dip+n:isNext?n-dim:n;
    const isToday=!isPrev&&!isNext&&today.getDate()===n&&today.getMonth()===calMonthIdx&&today.getFullYear()===calYear;
    const isSel=selectedDay===n&&!isPrev&&!isNext;
    const dots=(!isPrev&&!isNext&&dotMap[n])?dotMap[n].map(c=>'<div class="cal-dot" style="background:'+c+'"></div>').join(''):'';
    html+='<div class="cal-day'+(isPrev||isNext?' other-month':'')+(isToday?' today':'')+(isSel?' selected':'')+'" onclick="'+((!isPrev&&!isNext)?'selectCalDay('+n+')':'')+'">'+'<div class="cal-day-num">'+disp+'</div><div class="cal-dots">'+dots+'</div></div>';
  }
  document.getElementById('calDays').innerHTML=html;
  renderCalTasks();
}
function selectCalDay(d){selectedDay=selectedDay===d?null:d;renderCalendar();}
function renderCalTasks(){
  const header=document.getElementById('calTasksHeader');
  let f;
  if(selectedDay){
    f=tasks.filter(t=>{if(!t.reminder)return false;const d=new Date(t.reminder);return d.getFullYear()===calYear&&d.getMonth()===calMonthIdx&&d.getDate()===selectedDay;});
    header.textContent=f.length?'Tasks on '+MONTHS[calMonthIdx]+' '+selectedDay:'No tasks on '+MONTHS[calMonthIdx]+' '+selectedDay;
  } else {
    f=tasks.filter(t=>{if(!t.reminder)return false;const d=new Date(t.reminder);return d.getFullYear()===calYear&&d.getMonth()===calMonthIdx;}).sort((a,b)=>a.reminder-b.reminder);
    header.textContent=f.length?f.length+' task'+(f.length>1?'s':'')+' this month':'No reminders this month';
  }
  document.getElementById('calTaskList').innerHTML=f.length===0?'<div class="empty-state">No tasks to show.</div>':f.map(t=>taskCard(t,t.done)).join('');
}
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>el.classList.remove('show'),2400);}

checkNotifBanner();
renderAll();
if(Notification.permission==='granted')tasks.filter(t=>!t.done&&t.reminder&&t.reminder>Date.now()).forEach(scheduleReminder);
